<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disco Light</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: pointer;
    /* Smooth transition hata diya hai taki pure strobe disco effect aaye */
    transition: none; 
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-family: sans-serif;
    font-size: 12px;
    text-shadow: 0 0 4px black;
    z-index: 10;
    pointer-events: none;
  }

  /* ---- Pause popup panel (naya addition) ---- */
  #pausePanel {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(20, 20, 20, 0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 22px 26px;
    text-align: center;
    font-family: sans-serif;
    z-index: 20;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    cursor: default;
  }
  #pausePanel p {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    margin-bottom: 16px;
  }
  #resumeBtn {
    background: #ffffff;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #resumeBtn:hover {
    background: #eee;
  }
</style>
</head>
<body>

<div id="hint">Tap anywhere or press ESC to stop</div>

<!-- Pause popup panel -->
<div id="pausePanel">
  <p>sahilosphere@gmail.com</p>
  <button id="resumeBtn">Resume</button>
</div>

<script>
  let interval = null;
  // Speed ko bahut fast (40ms) kar diya gaya hai for crazy disco speed
  const SPEED_MS = 40; 

  function randomBrightColor() {
    // Full brightness, high saturation colors (HSL with 100% saturation, 50% lightness)
    const hue = Math.floor(Math.random() * 360);
    return `hsl(${hue}, 100%, 50%)`;
  }

  function startDisco() {
    if (interval) return;
    interval = setInterval(() => {
      document.body.style.backgroundColor = randomBrightColor();
    }, SPEED_MS);
    document.getElementById('pausePanel').style.display = 'none';
  }

  function stopDisco() {
    clearInterval(interval);
    interval = null;
    document.getElementById('hint').style.display = 'block';
    document.getElementById('pausePanel').style.display = 'block';
  }

  // Start immediately on load
  startDisco();

  // Safety exits: click/tap anywhere, or Escape key
  document.addEventListener('click', (e) => {
    // Popup ke andar click ho to disco stop na ho
    if (document.getElementById('pausePanel').contains(e.target)) return;
    stopDisco();
  });
  document.addEventListener('touchstart', (e) => {
    if (document.getElementById('pausePanel').contains(e.target)) return;
    stopDisco();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') stopDisco();
  });

  // Resume button click
  document.getElementById('resumeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    startDisco();
  });
</script>

</body>
</html>
